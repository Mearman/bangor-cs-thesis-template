name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Mearman/actions/.github/actions/commitlint@commitlint-v1


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          curl -sL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        run: ./actionlint -color
      - name: Lint workflow YAML
        run: yamllint .github/workflows/
      - name: Vendor stamp consistency
        run: |
          declared=$(cat vendor/VERSION)
          actual=$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' vendor/bangor.sty)
          if [ "$declared" != "$actual" ]; then
            echo "vendor/VERSION says ${declared} but vendor/bangor.sty is ${actual}"
            exit 1
          fi
          echo "vendor stamp consistent: ${declared}"
      - name: README link check
        run: |
          status=0
          grep -oE 'https://[^)\]]+' README.md | sort -u | while IFS= read -r url; do
            case "$url" in
              *img.shields.io*|*ctan.org*|*latex-project.org*) continue ;;
            esac
            if ! curl -sf -o /dev/null --max-time 15 "$url"; then
              echo "broken link: $url"
              status=1
            fi
          done
          exit ${status:-0}
      - name: British spelling check
        run: |
          status=0
          check() {
            BR="$1"; AM="$2"
            # Macro names are stripped before matching: \color is a command
            # and cannot be spelt the British way, so only a bare word in
            # prose counts.
            if grep -rIi "\b$AM\b" --include="*.tex" --include="*.md" . \
                | grep -v vendor/ | grep -v .git/ \
                | sed -E "s/\\\\[A-Za-z]+//g" \
                | grep -i "\b$AM\b"; then
              echo "American spelling '$AM' found (expected: $BR)"
              status=1
            fi
          }
          check colour color
          check behaviour behavior
          check centre center
          check organise organize
          check analyse analyze
          check licence license
          check favourite favorite
          check honour honor
          check neighbour neighbor
          check labelling labeling
          check modelling modeling
          check travelling traveling
          check cancelled canceled
          check fulfilled fullfiled
          exit $status

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache LaTeX build state
        uses: actions/cache@v4
        with:
          path: |
            *.aux
            *.fdb_latexmk
            *.fls
            *.bcf
            *.bbl
          key: latex-build-${{ hashFiles('**/*.tex', 'vendor/*') }}
          restore-keys: |
            latex-build-
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
        with:
          extra: texlive-science
      - name: Compile
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex
          if grep -E "^!" main.log; then
            echo "assertion failed: main.log matches"
            exit 1
          fi
          if grep -E "Reference .* undefined|Citation .* undefined|multiply defined" main.log; then
            echo "assertion failed: main.log matches"
            exit 1
          fi
      - name: Assert compile fits the Overleaf free-tier timeout
        run: |
          # A forced recompile reuses the auxiliary files the earlier steps
          # left behind, so it pays only a fraction of a first compile and
          # cannot catch a regression that pushes a cold compile past the
          # budget. Clear the build state first so the timer measures what
          # a reader opening the project on Overleaf actually pays. Cold
          # measured around 3s on CI runners; the bound leaves room for
          # runner variance without accepting a doubled cost.
          latexmk -C >/dev/null 2>&1
          start=$(date +%s)
          latexmk -pdf -interaction=nonstopmode main.tex >/dev/null 2>&1
          elapsed=$(($(date +%s) - start))
          echo "cold compile took ${elapsed}s"
          [ "$elapsed" -lt 10 ]
